<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Fall detection</title>
  <style>
    body { font-family: Arial, sans-serif; }
    #top {
      padding: 12px;
      border: 2px solid black;
      width: 90vw;
      margin-bottom: 12px;
    }
    .big {
      font-size: 30px;
      font-weight: bold;
      margin: 6px 0;
    }
    .status {
      padding: 6px 10px;
      display: inline-block;
      border-radius: 8px;
      border: 2px solid black;
    }
    .green { background: #c8f7c5; }
    .red { background: #ffb3b3; }
    .gray { background: #e0e0e0; }
/*
#messages {
  overflow-y: scroll;
  height: 10vh;
  width: 10vw;
  border: 1px solid #ccc;
  padding: 8px;
}
*/
.alert {
  width: 60vw;
  margin-top: 40px;  
  padding: 40px;
  margin-bottom: 20px;
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  border-radius: 12px;
}

.safe {
  background-color: #d4edda;
  color: #155724;
  border: 2px solid #28a745;
}

.danger {
  background-color: #f8d7da;
  color: #721c24;
  border: 2px solid #dc3545;
}


  </style>
</head>

<body>
  <h1>Fall-detecting system</h1>

  <div id="top">
    <div class="big">Patient: <span id="patient">Sigrid Larsson, 89 years, Johannebergsgatan 10</span></div>

    <div class="big">
      Sensor: <span id="sensorStatus" class="status gray">NOT CONNECTED</span>
    </div>

    <div class="big">
      Doing now: <span id="doingNow" class="status gray">WALKING</span>
    </div>

    <div class="big">
      Act now: <span id="actNow" class="status gray">NO</span>
    </div>
  </div>  <!-- ✅ THIS closes #top correctly -->

  <div id="alertBanner" class="alert safe">
    NO ACTION NEEDED
  </div>

  <ul id="messages"></ul>

  <script>
    // Change IP address to your current wifi IP address
    var ipAddress = "172.20.10.13";
    var ws = new WebSocket("ws://" + ipAddress + ":8000/ws");

    function setAlertBanner(isFall) {
      var banner = document.getElementById("alertBanner");

      if (isFall) {
        banner.textContent = "🚨 FALL DETECTED — GO NOW";
        banner.className = "alert danger";
      } else {
        banner.textContent = "NO ACTION NEEDED";
        banner.className = "alert safe";
      }
    }

    function setConnected(isConnected) {
      var el = document.getElementById("sensorStatus");
      if (isConnected) {
        el.textContent = "CONNECTED";
        el.className = "status green";
      } else {
        el.textContent = "NOT CONNECTED";
        el.className = "status red";
      }
    }

    function setFallUI(isFall) {
      var doing = document.getElementById("doingNow");
      var act = document.getElementById("actNow");

      if (isFall) {
        doing.textContent = "FALL";
        doing.className = "status red";

        act.textContent = "YES";
        act.className = "status red";
      } else {
        doing.textContent = "NORMAL";
        doing.className = "status green";

        act.textContent = "NO";
        act.className = "status green";
      }
    }

    ws.onopen = function () {
      console.log("WebSocket OPEN");
      setConnected(true);
      // Reset banner to safe when connection starts
      setAlertBanner(false);
    };

    ws.onmessage = function (event) {
      console.log("Received:", event.data);

      // log list (as before)
      var messages = document.getElementById('messages');
      var message = document.createElement('li');
      message.textContent = event.data;
      // messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;

      // Try parse JSON if server sends JSON
      // If parse fails, we do nothing (still logs)
      try {
        var payload = JSON.parse(event.data);

        // Example rule:
        // If payload.label == 1 => fall
        // Change this mapping to match your backend
        if (payload.label === 1 || payload.label === "fall") {
          setFallUI(true);
          setAlertBanner(true);
        } else {
          setFallUI(false);
          setAlertBanner(false);
        }
      } catch (e) {
        // Not JSON, ignore (still logged)
      }
    };

    ws.onclose = function () {
      console.log("WebSocket CLOSED");
      setConnected(false);
    };

    ws.onerror = function () {
      console.log("WebSocket ERROR");
      setConnected(false);
    };

    document.getElementById('closeButton').addEventListener('click', function () {
      ws.close();
      console.log("Connection Closed");
    });
  </script>
</body>
</html>
